[project]
name = "odl-assignment"
version = "0.1.0"
description = "Local WSL2 CPU/GPU workflow for Beijing multi-site air-quality forecasting"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.29,<8",
    "joblib>=1.3,<2",
    "jupyterlab>=4.2,<5",
    "keras-tuner==1.4.8",
    "matplotlib>=3.8,<4",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "numpy>=1.26,<2.4",
    "pandas>=2.2,<3",
    "psutil>=6,<8",
    "pyarrow>=14,<26",
    "scikit-learn>=1.4,<2",
    "seaborn>=0.13,<1",
    "tensorflow[and-cuda]==2.21.0",
    "tensorboard>=2.21,<2.22",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
